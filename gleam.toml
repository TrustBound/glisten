name = "dream_socket_server"
version = "1.0.0"
description = "A temporary fork of glisten for Dream: glisten 9.0.1 plus a socket buffer fix. If you are not using Dream, use glisten."
licences = ["Apache-2.0"]
repository = { type = "github", user = "TrustBound", repo = "glisten" }
gleam = ">= 1.11.0"

[erlang]
extra_applications = ["ssl"]

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_erlang = ">= 1.0.0 and < 2.0.0"
logging = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.2.0 and < 2.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
